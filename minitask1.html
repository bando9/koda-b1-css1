  <style>

      box-sizing: content-box;
      padding: 2px;
      display: inline-block;

      position: relative;
    }
    .dark {
      background-color: #006294;

    .box {

      height: 50px;

      top: 0;
      background-color: #006294;
      width: 200px;
      height: 55px;
    }

      display: inline-block;
      width: 100px;
