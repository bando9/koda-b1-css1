<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minitask 1 - Chessboard</title>
  </head>
  <style>
    .container {
      margin: 0;
      border: 2px solid black;
      box-sizing: content-box;
      padding: 2px;
      display: inline-block;
    }
    .dark {
      background-color: #006294;
    }
    .light {
      background-color: #94c7f7;
    }
    .box {
      display: inline-block;
      width: 50px;
      height: 50px;
    }
  </style>
  <body>
    <div class="container">
      <div class="row">
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
      </div>

      <div class="row">
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
      </div>

      <div class="row">
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
      </div>

      <div class="row">
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
      </div>

      <div class="row">
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
      </div>

      <div class="row">
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
      </div>

      <div class="row">
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
      </div>

      <div class="row">
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
        <div class="dark box"></div>
        <div class="light box"></div>
      </div>
    </div>
  </body>
</html>
